name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-pytest:
    name: API pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: shiprate
          POSTGRES_PASSWORD: shiprate
          POSTGRES_DB: shiprate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiprate -d shiprate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      ENV: test
      SHIPRATE_REQUIRE_DATABASE: "1"
      SHIPRATE_RLS_ENABLED: "1"
      ALLOW_DEV_TENANT_HEADER: "1"
      SHIPRATE_ALLOW_TEST_BEARER: "1"
      TEST_DATABASE_URL: postgresql://shiprate:shiprate@localhost:5432/shiprate_test
      TEST_APP_DATABASE_URL: postgresql://shiprate_app:shiprate@localhost:5432/shiprate_test
      DATABASE_URL: postgresql+asyncpg://shiprate:shiprate@localhost:5432/shiprate_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-cov psycopg2-binary
          pip install -e ".[dev]"

      - name: Migrate database
        run: |
          alembic upgrade head
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$TEST_DATABASE_URL" -f scripts/create_roles.sql

      - name: Run pytest
        run: python -m pytest tests -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Lint
        run: |
          pip install ruff
          ruff check .

  web-playwright:
    name: Web Playwright smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: shiprate
          POSTGRES_PASSWORD: shiprate
          POSTGRES_DB: shiprate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiprate -d shiprate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      ENV: test
      SHIPRATE_RLS_ENABLED: "1"
      ALLOW_DEV_TENANT_HEADER: "1"
      SHIPRATE_ALLOW_TEST_BEARER: "1"
      TEST_DATABASE_URL: postgresql://shiprate:shiprate@localhost:5432/shiprate_test
      TEST_APP_DATABASE_URL: postgresql://shiprate_app:shiprate@localhost:5432/shiprate_test
      DATABASE_URL: postgresql+asyncpg://shiprate:shiprate@localhost:5432/shiprate_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: API migrate and seed
        working-directory: apps/api
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql://shiprate:shiprate@localhost:5432/shiprate_test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          alembic upgrade head
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$TEST_DATABASE_URL" -f scripts/create_roles.sql
          python scripts/seed_e2e.py

      - name: Start API
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:43123
        run: pnpm exec playwright test

[project]
name = "shiprate-api"
version = "0.1.0"
description = "Shiprate Enforcer API (application code lives alongside this test harness)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "rls: Postgres row-level security tenant isolation",
    "integration: requires database or full app stack",
]

[project]
name = "shiprate-api"
version = "0.1.0"
description = "Shiprate Enforcer API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rating_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "rls: Postgres row-level security tenant isolation",
    "integration: requires database or full app stack",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/models/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
